<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Snapshots | Image Gallery</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="site-header">
    <h1>Snapshots</h1>
    <p>A small collection of nature and city photographs.</p>
    <div class="filters">
      <button class="filter active" data-category="all">All</button>
      <button class="filter" data-category="nature">Nature</button>
      <button class="filter" data-category="city">City</button>
    </div>
  </header>

  <main id="grid" class="grid"></main>

  <div id="lightbox" class="lightbox" role="dialog" aria-modal="true" aria-label="Image viewer">
    <button id="closeBtn" class="lb-btn close" aria-label="Close viewer">&times;</button>
    <button id="prevBtn" class="lb-btn prev" aria-label="Previous image">&#10094;</button>
    <figure>
      <img id="lbImage" alt="">
      <figcaption id="lbCaption"></figcaption>
    </figure>
    <button id="nextBtn" class="lb-btn next" aria-label="Next image">&#10095;</button>
  </div>

  <footer class="site-footer">CodeAlpha Frontend Internship &middot; Task 1 &middot; Built by Jim Hope</footer>
  <script src="js/main.js"></script>
</body>
</html>
